services:
  - type: web
    name: digital-shield
    runtime: node
    plan: free
    rootDir: Digital-Shield-MVP
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: STAFF_TOKEN
        generateValue: true
